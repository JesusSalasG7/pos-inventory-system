          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        cash_sales_ves:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        electronic_sales_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        electronic_sales_ves:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        expenses_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        expenses_ves:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        expected_cash_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        expected_cash_ves:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - cash_sales_usd
      - cash_sales_ves
      - electronic_sales_usd
      - electronic_sales_ves
      - expected_cash_usd
      - expected_cash_ves
      - expenses_usd
      - expenses_ves
      - opening_float
    CashExpense:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cash_session:
          type: integer
          readOnly: true
        reason:
          type: string
          maxLength: 255
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
