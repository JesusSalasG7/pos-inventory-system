          readOnly: true
        usd_to_ves_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
        effective_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - effective_date
      - id
      - source
      - usd_to_ves_rate
    InventoryMovement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
          readOnly: true
        branch:
          type: string
          readOnly: true
        movement_type:
          allOf:
          - $ref: '#/components/schemas/InventoryMovementMovementTypeEnum'
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          readOnly: true
        stock_before:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          readOnly: true
        stock_after:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          readOnly: true
        user:
          type: integer
          readOnly: true
        sale:
          type: integer
          readOnly: true
          nullable: true
        notes:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - branch
      - created_at
      - id
      - movement_type
      - notes
      - product
      - quantity
      - sale
      - stock_after
      - stock_before
      - user
    InventoryMovementCreate:
      type: object
      description: Entrada, merma o ajuste manual. Las ventas generan su Kardex solas.
      properties:
        product_id:
          type: integer
          minimum: 1
        branch:
          type: string
          maxLength: 20
        movement_type:
          $ref: '#/components/schemas/InventoryMovementCreateMovementTypeEnum'
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          description: Cantidad que entra o se pierde. En un ADJUSTMENT es el stock
            contado.
        notes:
          type: string
          maxLength: 255
      required:
      - movement_type
      - product_id
      - quantity
    InventoryMovementCreateMovementTypeEnum:
      enum:
      - ENTRY
      - WASTE
      - ADJUSTMENT
      type: string
      description: |-
        * `ENTRY` - ENTRY
        * `WASTE` - WASTE
        * `ADJUSTMENT` - ADJUSTMENT
    InventoryMovementMovementTypeEnum:
      enum:
