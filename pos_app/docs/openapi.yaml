openapi: 3.0.3
info:
  title: POS Multi-Sucursal API
  version: 1.0.0
  description: Punto de venta y control de inventario multi-sucursal.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me
      description: Devuelve el usuario autenticado.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/branches/:
    get:
      operationId: branches_list
      description: Sucursales del negocio, ordenadas por nombre.
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
        description: Solo sucursales activas.
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - branches
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranchList'
          description: ''
    post:
      operationId: branches_create
      description: Crea una sucursal con stock cero de todos los productos.
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BranchCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BranchCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
  /api/v1/branches/{code}/:
    get:
      operationId: branches_retrieve
      description: Lectura para SUPERVISOR y MANAGER; escritura solo para MANAGER.
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - branches
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
    patch:
      operationId: branches_partial_update
      description: Cambia el nombre o activa/desactiva la sucursal. El código no cambia.
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBranchUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBranchUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBranchUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
  /api/v1/cash-sessions/:
    get:
      operationId: cash_sessions_list
      description: Lista las cajas de la sucursal, de la más reciente a la más antigua.
      parameters:
      - in: query
        name: branch
        schema:
          type: string
        description: Código de la sucursal.
      - in: query
        name: only_open
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - cash-sessions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCashSessionList'
          description: ''
    post:
      operationId: cash_sessions_open
      description: Abre una caja para el usuario autenticado.
      tags:
      - cash-sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenCashSession'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OpenCashSession'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpenCashSession'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashSession'
          description: ''
  /api/v1/cash-sessions/{id}/close/:
    post:
      operationId: cash_sessions_close
      description: Cierra la caja con los montos contados y calcula la diferencia.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cash-sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseCashSession'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CloseCashSession'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CloseCashSession'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashSession'
          description: ''
  /api/v1/cash-sessions/{id}/expenses/:
    get:
      operationId: cash_sessions_expenses_list
      description: Lista los egresos de la caja.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - cash-sessions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCashExpenseList'
          description: ''
    post:
      operationId: cash_sessions_expenses_create
      description: Registra un egreso de efectivo en una caja abierta.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cash-sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashExpense'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CashExpense'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CashExpense'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashExpense'
          description: ''
  /api/v1/cash-sessions/{id}/summary/:
    get:
      operationId: cash_sessions_summary
      description: 'Arqueo: efectivo esperado en la caja según ventas y egresos.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cash-sessions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashCountSummary'
          description: ''
  /api/v1/cash-sessions/current/:
    get:
      operationId: cash_sessions_current
      description: Caja abierta del usuario. Responde 409 `no_open_session` si no
        tiene.
      tags:
      - cash-sessions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashSession'
          description: ''
  /api/v1/exchange-rates/:
    get:
      operationId: exchange_rates_list
      description: Histórico de tasas, de la más reciente a la más antigua.
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - exchange-rates
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExchangeRateList'
          description: ''
    post:
      operationId: exchange_rates_create
      description: Registra una nueva tasa, que pasa a ser la activa.
      tags:
      - exchange-rates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExchangeRate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExchangeRate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRate'
          description: ''
  /api/v1/exchange-rates/bcv/:
    get:
      operationId: exchange_rates_bcv
      description: |-
        Tasa oficial del BCV, solo como referencia: no cambia la tasa activa.

        Responde 503 `bcv_rate_unavailable` si la fuente externa no responde.
      tags:
      - exchange-rates
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BcvRate'
          description: ''
  /api/v1/exchange-rates/bcv/sync/:
    post:
      operationId: exchange_rates_bcv_sync
      description: |-
        Sincroniza ahora la tasa activa con la del BCV.

        Responde 201 con la tasa nueva si el BCV publicó una, o 200 con la tasa
        activa si no cambió. Responde 503 `bcv_rate_unavailable` si el BCV no responde.
      tags:
      - exchange-rates
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRate'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRate'
          description: ''
  /api/v1/exchange-rates/current/:
    get:
      operationId: exchange_rates_current
      description: Tasa activa. Responde 409 `exchange_rate_not_set` si no hay ninguna.
      tags:
      - exchange-rates
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRate'
          description: ''
  /api/v1/inventory/:
    get:
      operationId: inventory_list
      description: Existencias de la sucursal.
      parameters:
      - in: query
        name: branch
        schema:
          type: string
        description: Código de la sucursal. Por defecto, la asignada al usuario.
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranchInventoryList'
          description: ''
  /api/v1/inventory/{product_id}/minimum-stock/:
    patch:
      operationId: inventory_set_minimum_stock
      description: Define el stock mínimo del producto en la sucursal.
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMinimumStock'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMinimumStock'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMinimumStock'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchInventory'
          description: ''
  /api/v1/inventory/low-stock/:
    get:
      operationId: inventory_low_stock
      description: Productos activos con stock en o por debajo del mínimo.
      parameters:
      - in: query
        name: branch
        schema:
          type: string
        description: Código de la sucursal. Por defecto, la asignada al usuario.
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranchInventoryList'
          description: ''
  /api/v1/inventory/movements/:
    get:
      operationId: inventory_movements_list
      description: Kardex de la sucursal, del movimiento más reciente al más antiguo.
      parameters:
      - in: query
        name: branch
        schema:
          type: string
      - in: query
        name: created_from
        schema:
          type: string
          format: date-time
      - in: query
        name: created_to
        schema:
          type: string
          format: date-time
      - in: query
        name: movement_type
        schema:
          type: string
          enum:
          - ADJUSTMENT
          - ENTRY
          - SALE
          - WASTE
        description: |-
          * `ENTRY` - Entrada
          * `SALE` - Venta
          * `WASTE` - Merma
          * `ADJUSTMENT` - Ajuste
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: number
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInventoryMovementList'
          description: ''
    post:
      operationId: inventory_movements_create
      description: |-
        Registra una entrada, merma o ajuste.

        Responde 204 si un ajuste coincide con el stock actual y no cambia nada.
      tags:
      - inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryMovementCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InventoryMovementCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InventoryMovementCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryMovement'
          description: ''
        '204':
          description: No response body
  /api/v1/products/:
    get:
      operationId: products_list
      description: Catálogo de productos, ordenado por nombre.
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
        description: Solo productos activos.
      - in: query
        name: category
        schema:
          type: string
          enum:
          - ACCESSORIES
          - LIQUIDS
          - POWDERS
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Texto dentro del nombre.
      tags:
      - products
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
    post:
      operationId: products_create
      description: Crea un producto con stock cero en todas las sucursales activas.
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/products/{id}/:
    get:
      operationId: products_retrieve
      description: Lectura para SUPERVISOR y MANAGER; escritura solo para MANAGER.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    patch:
      operationId: products_partial_update
      description: Actualiza los campos enviados. No afecta a ventas ya facturadas.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/products/{id}/toggle-active/:
    post:
      operationId: products_toggle_active
      description: Activa o desactiva el producto.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/sales/:
    get:
      operationId: sales_list
      description: Ventas de la sucursal, de la más reciente a la más antigua.
      parameters:
      - in: query
        name: branch
        schema:
          type: string
          maxLength: 20
          minLength: 1
      - in: query
        name: cash_session
        schema:
          type: integer
          minimum: 1
      - in: query
        name: date_from
        schema:
          type: string
          format: date-time
      - in: query
        name: date_to
        schema:
          type: string
          format: date-time
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - sales
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSaleList'
          description: ''
    post:
      operationId: sales_create
      description: |-
        Registra una venta en la caja abierta del usuario.

        Los precios se toman de la base de datos y la tasa activa queda
        congelada en la venta.
      tags:
      - sales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSale'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateSale'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSale'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
          description: ''
  /api/v1/sales/{id}/:
    get:
      operationId: sales_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - sales
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
          description: ''
  /api/v1/sales/reports/summary/:
    get:
      operationId: sales_reports_summary
      description: Número de ventas y totales en USD y VES del periodo.
      parameters:
      - in: query
        name: branch
        schema:
          type: string
          maxLength: 20
          minLength: 1
      - in: query
        name: cash_session
        schema:
          type: integer
          minimum: 1
      - in: query
        name: date_from
        schema:
          type: string
          format: date-time
      - in: query
        name: date_to
        schema:
          type: string
          format: date-time
      tags:
      - sales
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesSummary'
          description: ''
  /api/v1/users/:
    get:
      operationId: users_list
      description: Usuarios del sistema, ordenados por nombre de usuario.
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
        description: Solo usuarios activos.
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: users_create
      description: Crea un usuario con su contraseña inicial.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/users/{id}/:
    get:
      operationId: users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: users_partial_update
      description: Actualiza los campos enviados; con `password` asigna una contraseña
        nueva.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
components:
  schemas:
    BcvRate:
      type: object
      description: Tasa oficial del BCV obtenida de la fuente externa (solo lectura).
      properties:
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - rate
      - updated_at
    Branch:
      type: object
      properties:
        code:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        active:
          type: boolean
          readOnly: true
      required:
      - active
      - code
      - name
    BranchCreate:
      type: object
      properties:
        code:
          type: string
          description: Identificador estable, p. ej. `CENTRO`. No se puede cambiar.
          maxLength: 20
        name:
          type: string
          maxLength: 100
      required:
      - code
      - name
    BranchInventory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
          readOnly: true
        product_name:
          type: string
          readOnly: true
        branch:
          type: string
          readOnly: true
        current_stock:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          readOnly: true
        minimum_stock:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          readOnly: true
      required:
      - branch
      - current_stock
      - id
      - minimum_stock
      - product
      - product_name
    CashCountSummary:
      type: object
      properties:
        opening_float:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
