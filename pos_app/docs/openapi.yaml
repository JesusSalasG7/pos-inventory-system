        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    UnitOfMeasureEnum:
      enum:
      - LITER
      - KILOGRAM
      - UNIT
      type: string
      description: |-
        * `LITER` - Litro
        * `KILOGRAM` - Kilogramo
        * `UNIT` - Unidad
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        assigned_branch:
          type: string
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - assigned_branch
      - full_name
      - id
      - is_active
      - role
      - username
    UserCreate:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 8
        full_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        assigned_branch:
          type: string
          nullable: true
          description: Código de la sucursal; null = todas (solo MANAGER).
          maxLength: 20
      required:
      - assigned_branch
      - full_name
      - password
      - role
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
